<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logo de FixCampus">
  <!-- Logo FixCampus: un marcador de ubicación (el lugar del problema) con un check (problema resuelto). -->
  <defs>
    <linearGradient id="fondoLogo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d6a62"/>
      <stop offset="0.55" stop-color="#408f86"/>
      <stop offset="1" stop-color="#5c8faa"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#fondoLogo)"/>
  <!-- Línea del suelo / campus -->
  <path d="M14 50h36" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
  <!-- Marcador de ubicación -->
  <path d="M32 11c-9.4 0-17 7.4-17 16.6 0 11.8 14.2 22.7 15.6 23.8a2.3 2.3 0 0 0 2.8 0C34.8 50.3 49 39.4 49 27.6 49 18.4 41.4 11 32 11z" fill="#ffffff"/>
  <circle cx="32" cy="27.5" r="9.5" fill="url(#fondoLogo)"/>
  <!-- Check de "resuelto" -->
  <path d="M27.6 27.8l3.2 3.2 5.8-6.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
