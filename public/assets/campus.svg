<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Ilustración: campus con un reporte de incidencia desde el celular">
  <!-- Ilustración original de FixCampus, dibujada con la paleta Campus Sereno. -->

  <!-- Fondo -->
  <circle cx="205" cy="150" r="128" fill="#e6f2f0"/>
  <ellipse cx="110" cy="70" rx="26" ry="10" fill="#ffffff"/>
  <ellipse cx="128" cy="62" rx="18" ry="12" fill="#ffffff"/>
  <ellipse cx="300" cy="58" rx="22" ry="8" fill="#ffffff"/>

  <!-- Suelo -->
  <rect x="24" y="226" width="352" height="5" rx="2.5" fill="#b9d6d1"/>

  <!-- Árbol -->
  <rect x="114" y="194" width="8" height="34" rx="2" fill="#8a6a4f"/>
  <circle cx="118" cy="182" r="19" fill="#408f86"/>
  <circle cx="105" cy="196" r="12" fill="#3a8178"/>
  <circle cx="131" cy="196" r="11" fill="#4c9a90"/>

  <!-- Edificio principal (universidad) -->
  <rect x="150" y="124" width="120" height="104" rx="4" fill="#ffffff" stroke="#0d6a62" stroke-width="3"/>
  <polygon points="142,127 210,86 278,127" fill="#408f86"/>
  <circle cx="210" cy="111" r="8" fill="#ffffff"/>
  <path d="M210 106v5l3 2" stroke="#0d6a62" stroke-width="2" fill="none" stroke-linecap="round"/>
  <rect x="163" y="146" width="10" height="66" rx="2" fill="#e8f0f5"/>
  <rect x="183" y="146" width="10" height="66" rx="2" fill="#e8f0f5"/>
  <rect x="227" y="146" width="10" height="66" rx="2" fill="#e8f0f5"/>
  <rect x="247" y="146" width="10" height="66" rx="2" fill="#e8f0f5"/>
  <rect x="199" y="186" width="22" height="42" rx="3" fill="#5c8faa"/>
  <rect x="146" y="212" width="128" height="16" rx="3" fill="#d6dbde"/>

  <!-- Edificio lateral con una ventana "con problema" -->
  <rect x="286" y="150" width="58" height="78" rx="4" fill="#ffffff" stroke="#5c8faa" stroke-width="3"/>
  <rect x="296" y="162" width="14" height="12" rx="2" fill="#e8f0f5"/>
  <rect x="320" y="162" width="14" height="12" rx="2" fill="#e8f0f5"/>
  <rect x="296" y="182" width="14" height="12" rx="2" fill="#e8f0f5"/>
  <rect x="320" y="182" width="14" height="12" rx="2" fill="#f39c12"/>
  <rect x="296" y="202" width="14" height="12" rx="2" fill="#e8f0f5"/>
  <rect x="320" y="202" width="14" height="12" rx="2" fill="#e8f0f5"/>
  <!-- Gota (fuga) -->
  <path d="M352 196c0 0-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z" fill="#5c8faa"/>

  <!-- Marcador: el lugar reportado -->
  <path d="M327 104c-8 0-14.5 6.3-14.5 14.1 0 10 12.1 19.3 13.3 20.2a2 2 0 0 0 2.4 0c1.2-.9 13.3-10.2 13.3-20.2C341.5 110.3 335 104 327 104z" fill="#c0392b"/>
  <circle cx="327" cy="118" r="5.5" fill="#ffffff"/>
  <ellipse cx="327" cy="142" rx="7" ry="2" fill="#000000" opacity="0.12"/>

  <!-- Celular con el reporte -->
  <rect x="30" y="134" width="68" height="116" rx="12" fill="#212529"/>
  <rect x="36" y="144" width="56" height="94" rx="6" fill="#ffffff"/>
  <rect x="42" y="152" width="30" height="5" rx="2.5" fill="#408f86"/>
  <rect x="42" y="164" width="44" height="4" rx="2" fill="#d6dbde"/>
  <rect x="42" y="172" width="34" height="4" rx="2" fill="#d6dbde"/>
  <rect x="42" y="184" width="30" height="10" rx="5" fill="#fef3e2"/>
  <rect x="42" y="202" width="13" height="4" rx="2" fill="#408f86"/>
  <rect x="57" y="202" width="13" height="4" rx="2" fill="#408f86"/>
  <rect x="72" y="202" width="13" height="4" rx="2" fill="#d6dbde"/>
  <rect x="42" y="216" width="44" height="13" rx="6.5" fill="#0d6a62"/>

  <!-- Insignia de "resuelto" -->
  <circle cx="94" cy="138" r="12" fill="#1e7e4a" stroke="#ffffff" stroke-width="3"/>
  <path d="M88.5 138l3.6 3.6 6.6-7" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
