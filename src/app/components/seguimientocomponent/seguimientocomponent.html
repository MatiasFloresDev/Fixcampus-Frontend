<section class="contenedor">
  <div class="encabezado">
    <h1>Seguimiento del reporte #{{ reporteId }}</h1>
    <a mat-stroked-button [routerLink]="['/reportes', reporteId]">Volver al reporte</a>
  </div>
  <nav class="pestanas" aria-label="Seguimiento">
    <a mat-button routerLink="comentarios" routerLinkActive="activa">Comentarios</a>
    <a mat-button routerLink="recomendacion" routerLinkActive="activa">Recomendación</a>
  </nav>
  <router-outlet />
</section>
