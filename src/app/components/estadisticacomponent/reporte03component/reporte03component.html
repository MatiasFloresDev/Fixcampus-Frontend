<section class="container">
  <h2>Recomendaciones por prioridad del reporte</h2>
  <p class="grafico-leyenda">
    Distribución de recomendaciones técnicas generadas según el nivel de prioridad del reporte
    asociado.
  </p>

  @if (mensaje) {
    <p class="fc-mensaje fc-mensaje--error estado-texto" role="alert">{{ mensaje }}</p>
  }

  @if (lista.length > 0) {
    <div class="grafico">
      <canvas baseChart [type]="chartType" [data]="chartData" [options]="chartOptions"></canvas>
    </div>
  }
</section>
