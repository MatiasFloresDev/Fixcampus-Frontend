<section class="acceso">
  <p class="seccion">FixCampus</p>
  <h1>Iniciar sesión</h1>
  <p>Ingresa con tu cuenta para consultar los catálogos.</p>
  <form #form="ngForm" (ngSubmit)="ingresar()">
    <mat-form-field appearance="outline"
      ><mat-label>Correo electrónico</mat-label
      ><input
        matInput
        type="email"
        name="correo"
        [(ngModel)]="correo"
        required
        email
        autocomplete="username"
    /></mat-form-field>
    <mat-form-field appearance="outline"
      ><mat-label>Contraseña</mat-label
      ><input
        matInput
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        autocomplete="current-password"
    /></mat-form-field>
    @if (mensaje) {
      <p class="aviso error" role="alert">{{ mensaje }}</p>
    }
    <button mat-flat-button type="submit" [disabled]="form.invalid || cargando">
      {{ cargando ? 'Ingresando…' : 'Iniciar sesión' }}
    </button>
  </form>
</section>
