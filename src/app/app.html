<a class="saltar" href="#contenido">Saltar al contenido</a>
<header>
  <mat-toolbar
    ><a class="marca" routerLink="/categorias/listar">FixCampus</a><span class="espacio"></span>
    @if (acceso.tieneSesion()) {
      <button mat-button (click)="salir()">Salir</button>
    } @else {
      <a mat-button routerLink="/acceso">Iniciar sesión</a>
    }
  </mat-toolbar>
  <nav aria-label="Catálogos">
    <a
      mat-button
      routerLink="/categorias/listar"
      routerLinkActive="activo"
      ariaCurrentWhenActive="page"
      >Categorías</a
    ><a
      mat-button
      routerLink="/ubicaciones/listar"
      routerLinkActive="activo"
      ariaCurrentWhenActive="page"
      >Ubicaciones</a
    ><a mat-button routerLink="/roles/listar" routerLinkActive="activo" ariaCurrentWhenActive="page"
      >Roles</a
    >
  </nav>
</header>
<main id="contenido"><router-outlet /></main>
